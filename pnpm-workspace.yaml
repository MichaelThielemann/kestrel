packages:
  - playground
  # The scaffolder (`pnpm create kestrel`). Dependency-free and published separately; its templates/lib
  # are generated from the engine's own copies at pack time, so nothing here is a workspace link.
  - packages/create-kestrel
  # Opt-in extension layers (own packages, NOT bundled with `kestrel`): a consumer composes them after the
  # core, e.g. extends: ['@michaelthielemann/kestrel', 'kestrel-secure-gallery']. The core's `files` whitelist excludes this dir.
  - extensions/*
  # The single source of the system's specification (errors, brands, events), consumed by the engine and
  # the other packages.
  - packages/kestrel-contracts
  # The server domain package (content model, registries, schema-building pure functions).
  - packages/kestrel-core
  # The built-in field-type descriptors, block-definition helper, and field/block population walkers —
  # depends on @kestrel/core.
  - packages/kestrel-fields
  # The stateless single-admin session/auth domain — depends on @kestrel/core.
  - packages/kestrel-auth
  # The authorization (authz) domain: principal/policy/CSRF/IP-allowlist and the pipeline access gates —
  # depends on @kestrel/core and @kestrel/auth.
  - packages/kestrel-access
  # The media domain: uploads, storage drivers, derived variants, folders, and the media collections —
  # depends on @kestrel/core and @kestrel/access.
  - packages/kestrel-media
  # The built-in content collections (pages) and the relation field populator — depends on @kestrel/core.
  - packages/kestrel-collections
  # The publishing domain: the publish_deps/publish_status/publish_runs/published_snapshots tables, the
  # publishing <Module>Db adapter, the runtime static publisher, the publish orchestrator, and the
  # publish/publishRuns pipelines — depends on @kestrel/core, @kestrel/access and @kestrel/media.
  - packages/kestrel-publishing
  # The live delivery adapter (no-op DeliveryPort — published_snapshots is already the persistence), the
  # deliverySnapshot read pipeline, and the live redirect lookup — depends on @kestrel/core and
  # @kestrel/publishing.
  - packages/kestrel-delivery-live
  # The static delivery adapter (writes through a StorageDriver), the static per-route render lookup, and
  # the build-time S3 output deploy — depends on @kestrel/core, @kestrel/publishing and
  # @kestrel/delivery-live (for the delivery: 'live' branch of deliveryPortFor).
  - packages/kestrel-delivery-static

overrides:
  # A pnpm-WORKSPACE override: it hardens THIS repo's install only — it is not published to, nor inherited
  # by, consumers of the `kestrel` package, who get their own transitive resolutions.
  # drizzle-kit still depends on the deprecated @esbuild-kit chain, which pins esbuild@0.18.20 (a moderate
  # dev-server advisory) next to vite's own copy; the override collapses both onto one current build.
  # Smoke-test drizzle-kit after touching it.
  esbuild: ^0.28.1

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  # The native resolver behind @nuxt/eslint's import plugin. Its install step links the platform binary;
  # left unbuilt, a cold store fails the install outright rather than degrading, so `pnpm lint` cannot run.
  unrs-resolver: true
  vue-demi: true
