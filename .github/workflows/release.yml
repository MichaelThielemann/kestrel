name: Release

# Publishes the engine, both extensions, the scaffolder, and all ten @kestrel/* packages to npm when a v*
# tag is pushed — 14 packages in total. The @kestrel/* packages have to be real, independently published
# packages: the engine's own `dependencies` reference them by real semver, not a bundled copy — `pnpm pack`
# on the root rewrites `"@kestrel/core": "workspace:*"` to `"@kestrel/core": "0.1.0"`, which 404s on
# install unless that version is actually on the registry.
#
# Authentication is npm **trusted publishing** (OIDC): npm verifies this workflow's identity against the
# trusted publisher configured on each package, so no npm token exists in the repository, in the org, or
# on any machine. It also produces a provenance attestation linking the tarball to this commit and
# workflow run — which is why `id-token: write` is required.
#
# One-time setup per package. A trusted publisher cannot be configured for a package that does not exist,
# so each one needs a manual `pnpm publish --access public --no-provenance --no-git-checks` first (from
# the package's own directory) — `--no-provenance` because every manifest here sets
# `publishConfig.provenance`, which only works inside CI; `pnpm publish`, not `npm publish`, because a
# package with a real `workspace:*` dependency (the engine root, and every @kestrel/* package depending on
# another one) needs pnpm's own rewrite to a real version — see `.github/publish-if-new.sh`. Then, from npm 11.15:
#   npm trust github <package> --file release.yml --repo MichaelThielemann/kestrel --allow-publish
# `--file` is the workflow FILENAME of THIS repo — not a path, and not the `publish.yml` from npm's own
# example. A wrong value is accepted silently and only surfaces at the next release, as a 404 on PUT that
# reads like a permissions problem. `npm trust list <package>` shows what is actually stored. The account
# needs 2FA; a granular token with "bypass 2FA" is rejected for trust operations.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm build:packages

      # Never publish a red tree. These are the same gates CI runs, minus e2e — a tag is cut from a commit
      # that already passed CI on main, and re-running the browser suite here would only add flake surface.
      - run: pnpm test
      - run: pnpm test:nuxt
      - run: pnpm typecheck
      - run: pnpm build

      - name: Verify the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "tag v$tag does not match package.json $pkg"; exit 1; }

      # npm >= 11.5.1 is required for trusted publishing; the runner's bundled npm may be older.
      - run: npm install -g npm@latest

      # Each publish is skipped when that exact version is already on the registry. 14 packages go out
      # per tag, so a failure in one leaves the earlier ones published — without this, re-running the job
      # to finish the release dies on the first already-published package and the rest never ship. It also
      # lets a package that had to be published by hand (the one-time trusted-publisher bootstrap) pass
      # through a tag run cleanly.
      #
      # The ten @kestrel/* packages go out BEFORE the engine, in topological order of their own
      # @kestrel/* dependency lists (each package only after everything it depends on), so no consumer's `pnpm add
      # @michaelthielemann/kestrel` can land between the engine appearing on the registry and one of its
      # own real dependencies existing there. Publish order does not affect `npm publish` itself (each
      # package's manifest is self-contained; nothing here resolves another package's presence to
      # succeed) — this is a safety margin for installers racing the tag, not a hard requirement.
      - name: Publish @kestrel/contracts
        run: "$GITHUB_WORKSPACE/.github/publish-if-new.sh"
        working-directory: packages/kestrel-contracts
      - name: Publish @kestrel/core
        run: "$GITHUB_WORKSPACE/.github/publish-if-new.sh"
        working-directory: packages/kestrel-core
      - name: Publish @kestrel/auth
        run: "$GITHUB_WORKSPACE/.github/publish-if-new.sh"
        working-directory: packages/kestrel-auth
      - name: Publish @kestrel/access
        run: "$GITHUB_WORKSPACE/.github/publish-if-new.sh"
        working-directory: packages/kestrel-access
      - name: Publish @kestrel/fields
        run: "$GITHUB_WORKSPACE/.github/publish-if-new.sh"
        working-directory: packages/kestrel-fields
      - name: Publish @kestrel/collections
        run: "$GITHUB_WORKSPACE/.github/publish-if-new.sh"
        working-directory: packages/kestrel-collections
      - name: Publish @kestrel/media
        run: "$GITHUB_WORKSPACE/.github/publish-if-new.sh"
        working-directory: packages/kestrel-media
      - name: Publish @kestrel/publishing
        run: "$GITHUB_WORKSPACE/.github/publish-if-new.sh"
        working-directory: packages/kestrel-publishing
      - name: Publish @kestrel/delivery-live
        run: "$GITHUB_WORKSPACE/.github/publish-if-new.sh"
        working-directory: packages/kestrel-delivery-live
      - name: Publish @kestrel/delivery-static
        run: "$GITHUB_WORKSPACE/.github/publish-if-new.sh"
        working-directory: packages/kestrel-delivery-static
      - name: Publish engine
        run: "$GITHUB_WORKSPACE/.github/publish-if-new.sh"
      - name: Publish galleries-secure
        run: "$GITHUB_WORKSPACE/.github/publish-if-new.sh"
        working-directory: extensions/galleries-secure
      - name: Publish galleries-secure-proofing
        run: "$GITHUB_WORKSPACE/.github/publish-if-new.sh"
        working-directory: extensions/galleries-secure-proofing
      # `prepack`/`postpack` copy the engine's templates + scaffold lib in and out, and prepack refuses a
      # version that differs from the root manifest.
      - name: Publish create-kestrel
        run: "$GITHUB_WORKSPACE/.github/publish-if-new.sh"
        working-directory: packages/create-kestrel
