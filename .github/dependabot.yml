version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /examples/nginx-njs
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
